# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "Mixed-Signal Spiking Neural Network"   # Project title (e.g. "Simple CPU", "PLL", "ADC")
  team: "TODO"                      # Your Team name
  discord: "ema01710"                   # Optional: Discord username (for support / communication)
  description: "2-2-1 spiking neural network: analog leaky integrate-and-fire neurons, DPI synapses and current-steering weight DACs, with a digital register file for the 4-bit weights and an input pulse generator"

  gf_def_ready: false
  ws_def_ready: false
  drc_ready: false
  lvs_ready: false

  lvs_config: "lvs_config.json"
  export_control: "docs/Export_Control_GF_Rev8.2_SNN.docx"   # TODO: replace with the signed PDF once the export control office signs it

# Pad order = order of this list. The pad ring is split at each new
# power/ground pair, so each domain starts with its power pad followed by its
# ground pad, then that domain's signal pads.
pins:
  # ---- Digital domain: register file, pulse generator ----
  - name: VDDD
    io_type: power   # digital supply
  - name: VSSD
    io_type: ground  # digital ground
  - name: clk
    io_type: input_schmitt
  - name: rst
    io_type: input_cmos
  - name: data[0]
    io_type: input_cmos
  - name: data[1]
    io_type: input_cmos
  - name: data[2]
    io_type: input_cmos
  - name: data[3]
    io_type: input_cmos
  - name: addr[0]
    io_type: input_cmos
  - name: addr[1]
    io_type: input_cmos
  - name: addr[2]
    io_type: input_cmos
  - name: addr[3]
    io_type: input_cmos  # addr = 4'hF is idle (no write); there is no wren
  # the input pulse channels are enabled by register 14, not by pins
  - name: out[0]
    io_type: bidirectional
  - name: out[1]
    io_type: bidirectional
  - name: out[2]
    io_type: bidirectional
  - name: out[3]
    io_type: bidirectional
  - name: out[4]
    io_type: bidirectional
  # ---- Analog domain: SNN macro (neurons, DPIs, DACs, bias cell) ----
  - name: VDDA
    io_type: power   # analog supply, 3.3 V
  - name: VSSA
    io_type: ground  # analog ground
  - name: Iref
    io_type: analog  # bias-cell reference current, 100 nA into the pin
  - name: VT
    io_type: analog  # neuron firing threshold, 1.66 V

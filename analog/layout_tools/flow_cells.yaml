# Cell registry for flow.py: everything a stage needs that is not in the schematic.
# Paths are relative to this file. Add a cell = add an entry; no code.
#
#   schematic   xschem .sch (or a .spice netlist)
#   connect     explicit schematic fixes {net: to}; remove once the schematic is fixed
#   symbol      .sym whose pin order the post-layout wrapper uses (optional)
#   testbench   xschem testbench .sch whose DUT is the top-level instance x1 (optional)
#   metric      what the sim stage measures: period of a node crossing a threshold
#   pin_sides   {default: W, <pin>: side}: cell edge each pin leaves on (W/E/N/S); default W.
#               VSS / VDD: list of W and/or E (met1 strap to each edge); default [W]
#   cap_place   beside (default: MIM caps in a column right of the rows) | over_devices
#               (one cap over the NMOS row: narrower cell; two_row supports 1 cap there)

neuron:
  schematic: ../neuron/neuron.sch
  # connect {x1_net2: VT} removed 2026-11-17: the VN wire in spike_amplifier.sch is fixed
  symbol: ../neuron/neuron.sym
  pin_sides: {default: W, spike: E, VSS: [W, E], VDD: [W, E]}   # row DAC | DPI | neuron; supplies both sides
  testbench: ../neuron/neuron_testbench.sch
  metric: {type: period, node: "v(spike)", threshold: 1.65}

spike_amplifier:
  schematic: ../neuron/spike_amplifier.sch
  connect: {net2: VN}             # same VN-wire bug
  symbol: ../neuron/spike_amplifier.sym

DAC_magnitude:
  schematic: ../DAC/DAC_magnitude.sch
  symbol: ../DAC/DAC_magnitude.sym

DPI:
  schematic: ../DPI/DPI.sch       # minimum-size DPI: excitatory synapse, and the core of DPI_inh
  symbol: ../DPI/DPI.sym
  pin_sides: {default: W, Isyn: E, Vthr: N, VT: S}
  cap_place: over_devices        # C2 over the NMOS row (2026-11-18 trial)

DAC:
  schematic: ../DAC/DAC.sch   # signed synapse DAC (1:2:4:8 + sign) of snn_analog_signed
  symbol: ../DAC/DAC.sym
  pin_sides: {default: W, Isum_e: E, Isum_i: E}

bias:
  schematic: ../neuron/bias.sch
  symbol: ../neuron/bias.sym
  pin_sides: {default: S}        # sits above the top row: every bias / Iref pin drops straight down

DPI_inh:
  schematic: ../DPI/DPI_inh.sch   # inhibitory DPI of snn_analog_signed: DPI core + nFET mirror sinking from VMEM
  symbol: ../DPI/DPI_inh.sym
  pin_sides: {default: W, Iout: E, Vthr: N, VT: S}   # same edges as DPI (shared Vthr / VT lines)
  cap_place: over_devices        # as DPI: cap over the NMOS band, right of its last via2

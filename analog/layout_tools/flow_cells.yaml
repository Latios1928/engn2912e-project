# Cell registry for flow.py: everything a stage needs that is not in the schematic.
# Paths are relative to this file. Add a cell = add an entry; no code.
#
#   schematic   xschem .sch (or a .spice netlist)
#   connect     explicit schematic fixes {net: to}; remove once the schematic is fixed
#   symbol      .sym whose pin order the post-layout wrapper uses (optional)
#   testbench   xschem testbench .sch whose DUT is the top-level instance x1 (optional)
#   metric      what the sim stage measures: period of a node crossing a threshold

neuron_glayout:
  schematic: ../neuron/neuron_sized.sch
  # connect {x1_net2: VT} removed 2026-11-17: the VN wire in spike_amplifier_sized.sch is fixed
  symbol: ../neuron/neuron_sized.sym
  testbench: ../neuron/neuron_sized_testbench.sch
  metric: {type: period, node: "v(spike)", threshold: 1.65}

spike_amp_fp:
  schematic: ../neuron/spike_amplifier_sized.sch
  connect: {net2: VN}             # same VN-wire bug
  symbol: ../neuron/spike_amplifier_sized.sym

DAC_binary:
  schematic: ../DAC/DAC_binary.sch
  symbol: ../DAC/DAC_binary.sym

DPI:
  schematic: ../DPI/DPI.sch       # minimum-size DPI: excitatory synapse, and the core of DPI_inh_min
  symbol: ../DPI/DPI.sym

DAC_signed_binary:
  schematic: ../DAC/DAC_signed_binary.sch   # signed synapse DAC (1:2:4:8 + sign) of snn_analog_signed
  symbol: ../DAC/DAC_signed_binary.sym

bias_cell:
  schematic: ../neuron/bias_cell.sch
  symbol: ../neuron/bias_cell.sym

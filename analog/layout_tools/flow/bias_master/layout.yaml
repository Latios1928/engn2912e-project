- id: G2
  type: binary_array
  devices:
  - M1
  - MS2
  - MREF
  decided_by: rule
  placement: common_centroid
  dummy_ring: group
  dummy_l: 6.0
  ratios:
  - 1
  - 2
  - 4
  reason: common gate Vgn / source VSS, unit ratios [1, 2, 4]
wells:
- id: W1
  kind: nwell
  body: VDD
  devices:
  - M3
  - M4
  - MS1_0
  - MS1_1
  - MS1_2
  - MS1_3
  - MS1_4
  - MS1_5
  - MS1_6
  - MS1_7
  - MS1_8
  - MS1_9
  required: false
  decided_by: rule
  reason: PMOS n-well on VDD (shared)
  cost_um2: 0
- id: W2
  kind: dnw
  body: VSS
  devices:
  - M2
  - M1
  - MS2
  - MS3
  - MREF
  required: false
  decided_by: policy
  reason: policy nmos_in_dnw (substrate-noise isolation)
  cost_um2: 8500
rings:
- around: W1
  type: n+ tap ring
  net: VDD
  required: true
  rule: DF.13 latch-up (tap within 20 um)
- around: W2
  type: p+ body ring
  net: VSS
  required: true
  rule: LVPWELL tie
- around: W2
  type: n+ DNW tie ring
  net: VDD
  required: true
  rule: DNW bias
- around: W2
  type: p+ substrate ring
  net: ground
  required: true
  rule: DN.3
floorplan:
  style: two_row
  order_n:
  - M1
  - MS2
  - MREF
  - M2
  - MS3
  order_p:
  - M3
  - M4
  - MS1_0
  - MS1_1
  - MS1_2
  - MS1_3
  - MS1_4
  - MS1_5
  - MS1_6
  - MS1_7
  - MS1_8
  - MS1_9
  dummy_l: 2.0
  dnw_islands: 1
  decided_by: rule
questions:
- id: Q-dummy_l
  about: floorplan.dummy_l
  question: matched devices have L up to 6 um; dummies at L=6 cost area, capped at 2 um now. Keep cap?
  options:
  - cap 2
  - match 6
  default: cap 2
  default_reason: policy decisions.defaults.dummy_l_over_cap
  answer: cap 2
  answered_by: auto
caps: []
resistors:
- name: R
  model: nwell
  a: VSS
  b: Vr
  bulk: VSS
  w: 2.0
  l: 585.38
schematic_warnings: []
schematic_changes:
- 'M3: m=4 x nf=1 -> nf=4, m=1 (parallel copies as fingers)'
- 'M4: m=4 x nf=1 -> nf=4, m=1 (parallel copies as fingers)'
- 'M2: m=64 x nf=1 -> nf=64, m=1 (parallel copies as fingers)'
- 'M1: m=8 x nf=1 -> nf=8, m=1 (parallel copies as fingers)'
- 'MS2: m=16 x nf=1 -> nf=16, m=1 (parallel copies as fingers)'
- 'MREF: m=4 x nf=1 -> nf=4, m=1 (parallel copies as fingers)'
mode: auto

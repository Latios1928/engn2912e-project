- id: W3
  kind: dnw
  body: GND
  devices:
  - Mi1
  - Mi2
  required: false
  decided_by: policy
  reason: policy nmos_in_dnw (substrate-noise isolation)
  cost_um2: 496
rings:
- around: W1
  type: p+ body ring

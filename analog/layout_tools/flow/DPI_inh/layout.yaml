# Layout decisions (decide.py). Edit an item and set decided_by: designer to
# keep it across re-runs; answer questions with `answer:`.
cell: DPI_inh
pins:
- Vthr
- VT
- Isum
- VDD
- Iout
nets:
  GND:
    class: rail
    why: ground
  Im:
    class: signal
    why: ''
  Iout:
    class: signal
    why: ''
  Isum:
    class: signal
    why: ''
  VDD:
    class: rail
    why: supply
  VT:
    class: bias_pin
    why: gate-only pin driving current sources / long-L devices
  Vthr:
    class: bias_pin
    why: gate-only pin driving current sources / long-L devices
  x1_net1:
    class: signal
    why: ''
groups:
- id: G1
  type: diff_pair
  devices:
  - x1_M1
  - x1_M2

- around: W3
  type: p+ body ring
  net: GND
  required: true
  rule: LVPWELL tie
- around: W3
  type: n+ DNW tie ring
  net: VDD
  required: true
  rule: DNW bias
- around: W3
  type: p+ substrate ring

# Layout decisions (decide.py). Edit an item and set decided_by: designer to
# keep it across re-runs; answer questions with `answer:`.
cell: DAC
pins:
- Isum_e
- w[3]
- w[2]
- w[1]
- w[0]
- en
- s
- Vb
- Isum_i
- VDD
nets:
  GND:
    class: rail
    why: ground
  Isum_e:
    class: signal
    why: ''
  Isum_i:
    class: signal
    why: ''
  VDD:
    class: rail
    why: supply
  Vb:
    class: bias_pin
    why: gate-only pin driving current sources / long-L devices
  Y:
    class: signal
    why: ''
  en:
    class: digital_pin
    why: gate-only pin, short L, drives a series switch
  s:
    class: digital_pin
    why: gate-only pin, short L, drives a series switch
  sb:
    class: switching
    why: inverter output
  w[0]:
    class: digital_pin
    why: gate-only pin, short L, drives a series switch
  w[1]:
    class: digital_pin
    why: gate-only pin, short L, drives a series switch
  w[2]:
    class: digital_pin
    why: gate-only pin, short L, drives a series switch
  w[3]:
    class: digital_pin
    why: gate-only pin, short L, drives a series switch
  x1_X:
    class: signal
    why: ''
  x1_net1:
    class: signal
    why: ''
  x1_net2:
    class: signal
    why: ''
  x1_net3:
    class: signal
    why: ''
  x1_net4:
    class: signal
    why: ''
groups:
- id: G1
  type: inverter
  devices:
  - Mni
  - Mpi
  decided_by: rule
  placement: free
  dummy_ring: none
  reason: N+P share gate s and drain sb
- id: G2
  type: diff_pair
  devices:
  - Mse
  - Msi
  decided_by: rule
  tail: x1_Men
  placement: adjacent
  dummy_ring: group
  dummy_l: 0.64

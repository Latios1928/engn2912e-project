- id: G3
  type: binary_array
  devices:
  - x1_M2
  - x1_M4
  - x1_M6
  - x1_M8
  decided_by: rule
  placement: common_centroid
  dummy_ring: group
  dummy_l: 8.0
  ratios:
  - 1
  - 2
  - 4
  - 8
  reason: common gate Vb / source GND, unit ratios [1, 2, 4, 8]
- id: G4
  type: switch
  devices:
  - x1_M1
  decided_by: rule
  placement: free
  dummy_ring: none
  reason: gate on digital pin w[0]
- id: G5
  type: switch
  devices:
  - x1_M3
  decided_by: rule
  placement: free
  dummy_ring: none
  reason: gate on digital pin w[1]
- id: G6
  type: switch
  devices:
  - x1_M5
  decided_by: rule
  placement: free
  dummy_ring: none
  reason: gate on digital pin w[2]
- id: G7
  type: switch
  devices:
  - x1_M7
  decided_by: rule
  placement: free
  dummy_ring: none
  reason: gate on digital pin w[3]
wells:
- id: W1
  kind: dnw
  body: GND
  devices:
  - x1_M1
  - x1_M2
  - x1_M3
  - x1_M4
  - x1_M5
  - x1_M6
  - x1_M7
  - x1_M8
  - x1_Men
  - Mse
  - Msi
  - Mni
  required: false
  decided_by: policy
  reason: policy nmos_in_dnw (substrate-noise isolation)
  cost_um2: 2538
- id: W2
  kind: nwell
  body: VDD
  devices:
  - Mpi
  required: false
  decided_by: rule
  reason: PMOS n-well on VDD (shared)
  cost_um2: 0
rings:
- around: W1
  type: p+ body ring
  net: GND
  required: true
  rule: LVPWELL tie
- around: W1
  type: n+ DNW tie ring
  net: VDD
  required: true
  rule: DNW bias
- around: W1
  type: p+ substrate ring
  net: ground
  required: true
  rule: DN.3
- around: W2
  type: n+ tap ring
  net: VDD
  required: true
  rule: DF.13 latch-up (tap within 20 um)
- around: W1
  type: extra p+ guard between groups
  required: false
  decided_by: policy
  enabled: false
  reason: switching ['x1_M1', 'x1_M3', 'x1_M5', 'x1_M7', 'Mni'] share a well with sensitive ['x1_M2', 'x1_M4', 'x1_M6',
    'x1_M8', 'Mse', 'Msi']

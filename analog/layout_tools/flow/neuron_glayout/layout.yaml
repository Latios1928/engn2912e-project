# Layout decisions (decide.py). Edit an item and set decided_by: designer to
# keep it across re-runs; answer questions with `answer:`.
cell: neuron_glayout
pins:
- VSS
- VDD
- VMEM
- VNA
- Vlk
- VK
- VIp
- VKup
- VKdn
- Vamp_bias
- VT
- spike
nets:
  VDD:
    class: rail
    why: supply
  VIp:
    class: bias_pin
    why: gate-only pin driving current sources / long-L devices
  VK:
    class: bias_pin
    why: gate-only pin driving current sources / long-L devices
  VKdn:
    class: bias_pin
    why: gate-only pin driving current sources / long-L devices
  VKup:
    class: bias_pin
    why: gate-only pin driving current sources / long-L devices
  VMEM:
    class: integrating
    why: top plate of a capacitor
  VNA:
    class: bias_pin
    why: gate-only pin driving current sources / long-L devices
  VSS:
    class: rail
    why: ground
  VT:
    class: bias_pin
    why: gate-only pin driving current sources / long-L devices
  Vamp_bias:
    class: bias_pin
    why: gate-only pin driving current sources / long-L devices
  Vlk:
    class: bias_pin
    why: gate-only pin driving current sources / long-L devices
  net1:
    class: signal
    why: ''
  net2:
    class: switching
    why: inverter output
  net3:
    class: signal
    why: ''
  net4:
    class: signal
    why: ''
  net5:
    class: signal
    why: ''
  net6:
    class: signal
    why: ''
  net7:
    class: signal
    why: ''
  spike:
    class: switching
    why: inverter output (with cap)
  x1_net1:
    class: signal
    why: ''
  x1_net3:
    class: signal
    why: ''
groups:
- id: G1
  type: inverter
  devices:
  - M1
  - M3
  decided_by: rule
  placement: free
  dummy_ring: none
  reason: N+P share gate net1 and drain net2
- id: G2
  type: inverter
  devices:
  - M2
  - M4
  decided_by: rule
  placement: free
  dummy_ring: none
  reason: N+P share gate net2 and drain spike
- id: G3
  type: diff_pair
  devices:
  - x1_M1
  - x1_M2
  decided_by: rule
  tail: x1_M3
  placement: adjacent
  dummy_ring: group
  dummy_l: 2.0
  reason: same W/L, common source x1_net1, gates VMEM/VT
- id: G4
  type: mirror
  devices:
  - x1_M4
  - x1_M5
  decided_by: rule
  diode:
  - x1_M4
  placement: adjacent
  dummy_ring: group
  dummy_l: 8.0
  reason: common gate x1_net3 / source VDD, diode ['x1_M4']
- id: G5
  type: switch
  devices:
  - M5
  decided_by: rule
  placement: free
  dummy_ring: none
  reason: gate on switching net2
- id: G6
  type: switch
  devices:
  - M6
  decided_by: rule
  placement: free
  dummy_ring: none
  reason: gate on switching spike
wells:
- id: W1
  kind: dnw
  body: VSS
  devices:
  - x1_M1
  - x1_M2
  - x1_M3
  - M1
  - M2
  - M6
  - M7
  - M8
  - M10
  - M11
  required: false
  decided_by: policy
  reason: policy nmos_in_dnw (substrate-noise isolation)
  cost_um2: 840
- id: W2
  kind: nwell
  body: VDD
  devices:
  - x1_M4
  - x1_M5
  - M3
  - M4
  - M5
  - M9
  - M12
  required: false
  decided_by: rule
  reason: PMOS n-well on VDD (shared)
  cost_um2: 0
rings:
- around: W1
  type: p+ body ring
  net: VSS
  required: true
  rule: LVPWELL tie
- around: W1
  type: n+ DNW tie ring
  net: VDD
  required: true
  rule: DNW bias
- around: W1
  type: p+ substrate ring
  net: ground
  required: true
  rule: DN.3
- around: W2
  type: n+ tap ring
  net: VDD
  required: true
  rule: DF.13 latch-up (tap within 20 um)
- around: W1
  type: extra p+ guard between groups
  required: false
  decided_by: policy
  enabled: false
  reason: switching ['M1', 'M2', 'M6'] share a well with sensitive ['x1_M1', 'x1_M2', 'M6', 'M11']
- around: W2
  type: extra p+ guard between groups
  required: false
  decided_by: policy
  enabled: false
  reason: switching ['M3', 'M4', 'M5'] share a well with sensitive ['x1_M4', 'x1_M5', 'M5']
floorplan:
  style: two_row
  order_n:
  - x1_M3
  - x1_M1
  - x1_M2
  - M1
  - M2
  - M6
  - M7
  - M8
  - M10
  - M11
  order_p:
  - x1_M4
  - x1_M5
  - M3
  - M4
  - M5
  - M9
  - M12
  dummy_l: 2.0
  dnw_islands: 1
  decided_by: rule
questions:
- id: Q-dummy_l
  about: floorplan.dummy_l
  question: matched devices have L up to 8 um; dummies at L=8 cost area, capped at 2 um now. Keep cap?
  options:
  - cap 2
  - match 8
  default: cap 2
  default_reason: policy decisions.defaults.dummy_l_over_cap
  answer: cap 2
  answered_by: auto
schematic_warnings: []
schematic_changes:
- 'M1: 0.22/0.28 -> 0.5/0.64 (W/L kept)'
- 'M2: 0.22/0.28 -> 0.5/0.64 (W/L kept)'
- 'M3: 0.22/0.28 -> 0.5/0.64 (W/L kept)'
- 'M4: 0.22/0.28 -> 0.5/0.64 (W/L kept)'
- 'M5: 0.22/0.28 -> 0.5/0.64 (W/L kept)'
- 'M6: 0.22/5 -> 0.5/11.36 (W/L kept)'
mode: auto
